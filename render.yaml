services:
  - type: web
    name: visionguard-ai
    env: python
    buildCommand: pip install -r requirements.txt && pip install fastapi uvicorn websockets
    startCommand: uvicorn app.web.server:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
